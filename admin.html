<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RepGo Admin</title>
<style>
  :root {
    --blue: #1a56db;
    --blue-dark: #1341a8;
    --blue-light: #e8f0fe;
    --green: #16a34a;
    --green-light: #dcfce7;
    --red: #dc2626;
    --red-light: #fee2e2;
    --yellow: #d97706;
    --yellow-light: #fef3c7;
    --purple: #7c3aed;
    --gray-50: #f9fafb;
    --gray-100: #f3f4f6;
    --gray-200: #e5e7eb;
    --gray-300: #d1d5db;
    --gray-400: #9ca3af;
    --gray-500: #6b7280;
    --gray-600: #4b5563;
    --gray-700: #374151;
    --gray-800: #1f2937;
    --gray-900: #111827;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 3px rgba(0,0,0,.1);
    --shadow-md: 0 4px 6px rgba(0,0,0,.07);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--gray-50);
    color: var(--gray-900);
    min-height: 100vh;
  }

  /* ---- AUTH ---- */
  #tela-auth {
    min-height: 100vh;
    background: linear-gradient(135deg, #111827 0%, #1f2937 60%, var(--purple) 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px;
  }

  .auth-logo {
    width: 72px; height: 72px;
    background: white; border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; font-weight: 800; color: var(--blue);
    margin-bottom: 8px;
    box-shadow: 0 8px 32px rgba(0,0,0,.3);
    position: relative;
  }

  .auth-logo::after {
    content: '';
    width: 14px; height: 14px;
    background: #22c55e; border-radius: 50%;
    position: absolute; bottom: 8px; right: 8px;
    border: 2px solid white;
  }

  .auth-brand { color: white; font-size: 24px; font-weight: 700; }
  .auth-badge { background: var(--purple); color: white; font-size: 11px; font-weight: 700;
    padding: 3px 10px; border-radius: 20px; letter-spacing: .5px; margin: 6px 0 28px; text-transform: uppercase; }

  .auth-card {
    background: white; border-radius: 20px; padding: 28px 24px;
    width: 100%; max-width: 360px;
    box-shadow: 0 24px 48px rgba(0,0,0,.3);
  }

  label { display: block; font-size: 13px; font-weight: 500; color: var(--gray-700); margin-bottom: 6px; }

  input[type=text], input[type=email], input[type=password], input[type=number], input[type=date], select, textarea {
    width: 100%; padding: 11px 14px;
    border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm);
    font-size: 15px; color: var(--gray-900); background: white;
    outline: none; transition: border-color .2s;
  }

  input:focus, select:focus { border-color: var(--blue); }
  .campo { margin-bottom: 16px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 18px; border: none; border-radius: var(--radius-sm);
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: all .15s; text-decoration: none; white-space: nowrap;
  }

  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--blue); color: white; width: 100%; padding: 12px; font-size: 15px; }
  .btn-primary:hover { background: var(--blue-dark); }
  .btn-secondary { background: var(--gray-100); color: var(--gray-700); }
  .btn-secondary:hover { background: var(--gray-200); }
  .btn-ghost { background: transparent; color: var(--blue); }
  .btn-danger { background: var(--red); color: white; }
  .btn-purple { background: var(--purple); color: white; }
  .btn-sm { padding: 7px 12px; font-size: 13px; border-radius: 6px; }
  .btn-icon { width: 36px; height: 36px; padding: 0; border-radius: 8px; font-size: 16px; }

  .erro-msg { color: var(--red); font-size: 13px; margin-top: 8px; text-align: center; }

  /* ---- ADMIN SHELL ---- */
  #admin-app { display: none; min-height: 100vh; flex-direction: column; }

  .admin-topbar {
    background: #111827; color: white;
    padding: 0 24px; height: 60px;
    display: flex; align-items: center; gap: 16px;
    position: sticky; top: 0; z-index: 100;
  }

  .admin-logo-sm {
    width: 36px; height: 36px; background: white; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: var(--blue); font-size: 16px;
    position: relative; flex-shrink: 0;
  }

  .admin-logo-sm::after {
    content: ''; width: 10px; height: 10px;
    background: #22c55e; border-radius: 50%;
    position: absolute; bottom: 4px; right: 4px;
    border: 1.5px solid white;
  }

  .admin-topbar-title { font-weight: 700; font-size: 16px; flex: 1; }
  .admin-topbar-badge { background: var(--purple); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }

  /* ---- STATS BAR ---- */
  .stats-bar {
    background: white; border-bottom: 1px solid var(--gray-200);
    padding: 16px 24px;
    display: flex; gap: 24px; overflow-x: auto;
  }

  .stat-item { flex-shrink: 0; text-align: center; }
  .stat-valor { font-size: 24px; font-weight: 800; color: var(--blue); }
  .stat-label { font-size: 12px; color: var(--gray-500); font-weight: 500; }

  /* ---- MAIN ---- */
  .admin-main { padding: 24px; max-width: 1200px; margin: 0 auto; width: 100%; }

  /* ---- FILTROS ---- */
  .admin-filtros {
    display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;
  }

  .filtro-status {
    padding: 8px 16px; border-radius: 20px; border: 1.5px solid var(--gray-200);
    background: white; font-size: 13px; font-weight: 500; color: var(--gray-600);
    cursor: pointer; transition: all .2s;
  }

  .filtro-status.ativo { border-color: var(--blue); color: var(--blue); background: var(--blue-light); }

  .busca-admin {
    flex: 1; min-width: 200px; padding: 9px 14px;
    border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm);
    font-size: 14px; outline: none;
  }

  .busca-admin:focus { border-color: var(--blue); }

  /* ---- TABELA REPS ---- */
  .reps-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }

  .rep-card {
    background: white; border-radius: var(--radius);
    padding: 16px; box-shadow: var(--shadow);
    cursor: pointer; transition: box-shadow .2s;
    border: 2px solid transparent;
  }

  .rep-card:hover { box-shadow: var(--shadow-md); border-color: var(--blue-light); }

  .rep-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }

  .rep-avatar {
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--blue-light); color: var(--blue);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 18px; flex-shrink: 0;
  }

  .rep-nome { font-size: 15px; font-weight: 700; color: var(--gray-900); }
  .rep-email { font-size: 12px; color: var(--gray-500); margin-top: 2px; }

  .plan-badge {
    font-size: 11px; font-weight: 700; padding: 3px 8px;
    border-radius: 20px; text-transform: uppercase; letter-spacing: .3px;
  }

  .plan-ativo { background: var(--green-light); color: var(--green); }
  .plan-trial { background: var(--blue-light); color: var(--blue); }
  .plan-inadimplente { background: var(--red-light); color: var(--red); }
  .plan-cancelado { background: var(--gray-100); color: var(--gray-500); }

  .rep-stats { display: flex; gap: 16px; }
  .rep-stat { text-align: center; }
  .rep-stat-val { font-size: 18px; font-weight: 700; color: var(--gray-800); }
  .rep-stat-lbl { font-size: 11px; color: var(--gray-400); }

  .rep-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--gray-100); }

  .rep-data { font-size: 12px; color: var(--gray-400); }
  .rep-acoes { display: flex; gap: 6px; }

  /* ---- MODAL ---- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    z-index: 200; display: none; align-items: center; justify-content: center;
    backdrop-filter: blur(2px); padding: 16px;
  }

  .modal-overlay.visivel { display: flex; }

  .modal {
    background: white; border-radius: 16px;
    padding: 24px; width: 100%; max-width: 560px;
    max-height: 90vh; overflow-y: auto;
    animation: fadeScale .2s ease-out;
  }

  @keyframes fadeScale {
    from { opacity: 0; transform: scale(.95); }
    to { opacity: 1; transform: scale(1); }
  }

  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .modal-titulo { font-size: 18px; font-weight: 700; }
  .modal-fechar { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--gray-400); padding: 4px; }

  .divider { height: 1px; background: var(--gray-200); margin: 16px 0; }

  .info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--gray-100); font-size: 14px; }
  .info-label { color: var(--gray-500); }
  .info-valor { font-weight: 600; color: var(--gray-800); }

  .campo-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* ---- TABS ---- */
  .tabs { display: flex; gap: 4px; background: var(--gray-100); border-radius: 8px; padding: 4px; margin-bottom: 16px; }
  .tab { flex: 1; padding: 8px; border: none; background: transparent; border-radius: 6px;
    font-size: 13px; font-weight: 500; color: var(--gray-500); cursor: pointer; transition: all .2s; }
  .tab.ativo { background: white; color: var(--blue); font-weight: 600; box-shadow: var(--shadow); }

  /* ---- MINI PEDIDO ---- */
  .mini-pedido {
    padding: 10px; background: var(--gray-50); border-radius: 8px;
    margin-bottom: 6px; font-size: 13px;
  }

  .mini-pedido-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .mini-pedido-marca { font-weight: 700; color: var(--blue); font-size: 11px; text-transform: uppercase; }
  .mini-pedido-valor { font-weight: 700; color: var(--gray-800); }
  .mini-pedido-cliente { color: var(--gray-600); }
  .mini-pedido-data { color: var(--gray-400); font-size: 11px; }

  /* ---- TOAST ---- */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--gray-800); color: white;
    padding: 10px 20px; border-radius: 20px;
    font-size: 14px; font-weight: 500;
    opacity: 0; transition: all .3s; z-index: 300;
    white-space: nowrap;
  }

  #toast.visivel { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Loading */
  .loading-overlay {
    position: fixed; inset: 0; background: rgba(255,255,255,.8);
    display: none; align-items: center; justify-content: center;
    z-index: 400; flex-direction: column; gap: 12px;
  }

  .loading-overlay.visivel { display: flex; }
  .spinner { width: 40px; height: 40px; border: 3px solid var(--gray-200); border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .vazio { text-align: center; padding: 48px 24px; color: var(--gray-400); }
  .vazio-icone { font-size: 48px; margin-bottom: 12px; }
  .vazio-texto { font-size: 16px; font-weight: 600; color: var(--gray-600); }

  @media (max-width: 600px) {
    .admin-main { padding: 16px; }
    .stats-bar { padding: 12px 16px; gap: 16px; }
    .admin-topbar { padding: 0 16px; }
    .reps-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- ===== AUTH ADMIN ===== -->
<div id="tela-auth">
  <div class="auth-logo">R</div>
  <div class="auth-brand">RepGo</div>
  <div class="auth-badge">Painel Admin</div>

  <div class="auth-card">
    <div class="campo">
      <label>E-mail admin</label>
      <input type="email" id="adm-email" placeholder="admin@repgo.com.br" autocomplete="email">
    </div>
    <div class="campo">
      <label>Senha</label>
      <input type="password" id="adm-senha" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" onclick="fazerLoginAdmin()">Entrar no painel</button>
    <div id="adm-erro" class="erro-msg"></div>
  </div>
</div>

<!-- ===== ADMIN APP ===== -->
<div id="admin-app">
  <div class="admin-topbar">
    <div class="admin-logo-sm">R</div>
    <div class="admin-topbar-title">RepGo</div>
    <div class="admin-topbar-badge">ADMIN</div>
    <div style="flex:1"></div>
    <button class="btn btn-secondary btn-sm" onclick="fazerLogoutAdmin()">Sair</button>
  </div>

  <div class="stats-bar" id="stats-bar">
    <div class="stat-item">
      <div class="stat-valor" id="stat-total">—</div>
      <div class="stat-label">Reps totais</div>
    </div>
    <div class="stat-item">
      <div class="stat-valor" style="color:var(--green)" id="stat-ativos">—</div>
      <div class="stat-label">Ativos</div>
    </div>
    <div class="stat-item">
      <div class="stat-valor" style="color:var(--blue)" id="stat-trial">—</div>
      <div class="stat-label">Trial</div>
    </div>
    <div class="stat-item">
      <div class="stat-valor" style="color:var(--red)" id="stat-inadimplentes">—</div>
      <div class="stat-label">Inadimplentes</div>
    </div>
    <div class="stat-item">
      <div class="stat-valor" style="color:var(--purple)" id="stat-mrr">—</div>
      <div class="stat-label">MRR estimado</div>
    </div>
  </div>

  <div class="admin-main">
    <div class="admin-filtros">
      <input class="busca-admin" id="busca-rep" placeholder="🔍 Buscar rep..." oninput="filtrarReps()">
      <button class="filtro-status ativo" id="fst-todos" onclick="setFiltroStatus('todos')">Todos</button>
      <button class="filtro-status" id="fst-ativo" onclick="setFiltroStatus('ativo')">Ativos</button>
      <button class="filtro-status" id="fst-trial" onclick="setFiltroStatus('trial')">Trial</button>
      <button class="filtro-status" id="fst-inadimplente" onclick="setFiltroStatus('inadimplente')">Inadimplentes</button>
      <button class="filtro-status" id="fst-cancelado" onclick="setFiltroStatus('cancelado')">Cancelados</button>
      <button class="btn btn-secondary btn-sm" onclick="carregarReps()">🔄 Atualizar</button>
    </div>

    <div id="lista-reps" class="reps-grid"></div>
  </div>
</div>

<!-- Modal perfil rep -->
<div class="modal-overlay" id="modal-rep">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-titulo" id="modal-rep-titulo">Perfil do rep</div>
      <button class="modal-fechar" onclick="fecharModal('modal-rep')">✕</button>
    </div>

    <div class="tabs">
      <button class="tab ativo" id="tab-info" onclick="mudarTabRep('info')">Perfil</button>
      <button class="tab" id="tab-pedidos" onclick="mudarTabRep('pedidos')">Pedidos</button>
      <button class="tab" id="tab-plano" onclick="mudarTabRep('plano')">Plano</button>
    </div>

    <!-- Tab: info -->
    <div id="tab-content-info">
      <div id="rep-infos"></div>
      <div class="divider"></div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-purple" style="flex:1" onclick="entrarComoRep()">▶ Entrar na conta</button>
        <button class="btn btn-secondary" onclick="fecharModal('modal-rep')">Fechar</button>
      </div>
    </div>

    <!-- Tab: pedidos -->
    <div id="tab-content-pedidos" style="display:none">
      <div id="rep-pedidos-lista"></div>
    </div>

    <!-- Tab: plano -->
    <div id="tab-content-plano" style="display:none">
      <div class="campo">
        <label>Status do plano</label>
        <select id="plano-status">
          <option value="trial">Trial</option>
          <option value="ativo">Ativo</option>
          <option value="inadimplente">Inadimplente</option>
          <option value="cancelado">Cancelado</option>
        </select>
      </div>
      <div class="campo">
        <label>Vencimento</label>
        <input type="date" id="plano-vencimento">
      </div>
      <div class="campo">
        <label>Observações internas</label>
        <textarea id="plano-obs" rows="3" placeholder="Notas sobre este rep..."></textarea>
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-secondary" onclick="fecharModal('modal-rep')">Cancelar</button>
        <button class="btn btn-primary" style="flex:1" onclick="salvarPlano()">Salvar plano</button>
      </div>
      <div id="plano-erro" class="erro-msg"></div>
    </div>

    <input type="hidden" id="modal-rep-uid">
  </div>
</div>

<!-- Toast & Loading -->
<div id="toast"></div>
<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <div style="font-size:14px;color:var(--gray-600)" id="loading-texto">Carregando...</div>
</div>

<script>
const SUPABASE_URL = 'https://xroedpxscpwikfzmjxio.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhyb2VkcHhzY3B3aWtmem1qeGlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDM3MDc1MDMsImV4cCI6MjAxOTI4MzUwM30.Ot-SdxwUhMeKwPQC0dItIm7h4lWRuAMpgYLiuRiZkGQ';

let adminUser = null;
let todosReps = [];
let filtroStatusAtual = 'todos';
let repAtual = null;

// =============================================
// SUPABASE
// =============================================
async function sb(endpoint, options = {}) {
  const headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': `Bearer ${SUPABASE_KEY}`,
    'Content-Type': 'application/json',
    'Prefer': 'return=representation',
    ...options.headers
  };
  if (adminUser?.access_token) {
    headers['Authorization'] = `Bearer ${adminUser.access_token}`;
  }
  const res = await fetch(`${SUPABASE_URL}${endpoint}`, { ...options, headers });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || err.hint || res.statusText);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function sbRpc(fn, params = {}) {
  return sb(`/rest/v1/rpc/${fn}`, { method: 'POST', body: JSON.stringify(params) });
}

// =============================================
// AUTH
// =============================================
async function fazerLoginAdmin() {
  const email = document.getElementById('adm-email').value.trim();
  const senha = document.getElementById('adm-senha').value;
  const erroEl = document.getElementById('adm-erro');
  erroEl.textContent = '';
  if (!email || !senha) { erroEl.textContent = 'Preencha os campos.'; return; }

  mostrarLoading('Autenticando...');
  try {
    const data = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: senha })
    }).then(r => r.json());

    if (!data.access_token) { throw new Error('Credenciais inválidas'); }

    adminUser = { id: data.user.id, email: data.user.email, access_token: data.access_token };
    localStorage.setItem('repgo_admin_session', JSON.stringify(adminUser));
    mostrarAdminApp();
  } catch(e) {
    erroEl.textContent = 'E-mail ou senha incorretos.';
  } finally { esconderLoading(); }
}

async function fazerLogoutAdmin() {
  localStorage.removeItem('repgo_admin_session');
  adminUser = null;
  document.getElementById('admin-app').style.display = 'none';
  document.getElementById('tela-auth').style.display = '';
}

async function mostrarAdminApp() {
  document.getElementById('tela-auth').style.display = 'none';
  document.getElementById('admin-app').style.display = 'flex';
  document.getElementById('admin-app').style.flexDirection = 'column';
  await carregarReps();
}

// =============================================
// REPS
// =============================================
async function carregarReps() {
  mostrarLoading('Carregando reps...');
  try {
    // Buscar todos os perfis
    const perfis = await sbRpc('admin_listar_reps') || [];

    // Buscar planos
    const planos = await sbRpc('admin_listar_planos') || [];

    // Combinar
    todosReps = perfis.map(p => {
      const plano = planos.find(pl => pl.user_id === p.user_id) || {};
      return { ...p, ...plano, plano_status: plano.status || 'trial' };
    });

    atualizarStats();
    renderizarReps(todosReps);
  } catch(e) {
    console.error('Erro ao carregar reps:', e);
    // Tentar fallback direto
    try {
      const perfis = await sb('/rest/v1/perfil_rep?select=*&order=created_at.desc');
      todosReps = (perfis || []).map(p => ({ ...p, plano_status: 'trial' }));
      atualizarStats();
      renderizarReps(todosReps);
    } catch(e2) {
      document.getElementById('lista-reps').innerHTML = `<div class="vazio"><div class="vazio-icone">⚠️</div><div class="vazio-texto">Erro ao carregar reps</div></div>`;
    }
  } finally { esconderLoading(); }
}

function atualizarStats() {
  const total = todosReps.length;
  const ativos = todosReps.filter(r => r.plano_status === 'ativo').length;
  const trial = todosReps.filter(r => r.plano_status === 'trial').length;
  const inadimplentes = todosReps.filter(r => r.plano_status === 'inadimplente').length;
  const mrr = ativos * 49;

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-ativos').textContent = ativos;
  document.getElementById('stat-trial').textContent = trial;
  document.getElementById('stat-inadimplentes').textContent = inadimplentes;
  document.getElementById('stat-mrr').textContent = 'R$ ' + mrr.toLocaleString('pt-BR');
}

function setFiltroStatus(status) {
  filtroStatusAtual = status;
  document.querySelectorAll('.filtro-status').forEach(b => b.classList.remove('ativo'));
  document.getElementById('fst-' + status)?.classList.add('ativo');
  filtrarReps();
}

function filtrarReps() {
  const busca = document.getElementById('busca-rep').value.toLowerCase();
  let lista = todosReps;
  if (filtroStatusAtual !== 'todos') {
    lista = lista.filter(r => r.plano_status === filtroStatusAtual);
  }
  if (busca) {
    lista = lista.filter(r =>
      r.nome?.toLowerCase().includes(busca) ||
      r.email?.toLowerCase().includes(busca)
    );
  }
  renderizarReps(lista);
}

function renderizarReps(lista) {
  const el = document.getElementById('lista-reps');
  if (lista.length === 0) {
    el.innerHTML = '<div class="vazio"><div class="vazio-icone">👥</div><div class="vazio-texto">Nenhum rep encontrado</div></div>';
    return;
  }

  el.innerHTML = lista.map(r => {
    const inicial = (r.nome || r.email || '?').charAt(0).toUpperCase();
    const badgeClass = { ativo: 'plan-ativo', trial: 'plan-trial', inadimplente: 'plan-inadimplente', cancelado: 'plan-cancelado' }[r.plano_status] || 'plan-trial';
    const badgeTexto = { ativo: 'Ativo', trial: 'Trial', inadimplente: 'Inadimplente', cancelado: 'Cancelado' }[r.plano_status] || 'Trial';
    const dataStr = r.created_at ? new Date(r.created_at).toLocaleDateString('pt-BR') : '';

    return `<div class="rep-card" onclick="abrirRep('${r.user_id}')">
      <div class="rep-header">
        <div class="rep-avatar">${escHtml(inicial)}</div>
        <div style="flex:1">
          <div class="rep-nome">${escHtml(r.nome || 'Sem nome')}</div>
          <div class="rep-email">${escHtml(r.email || r.user_id?.slice(0,8) + '...')}</div>
        </div>
        <span class="plan-badge ${badgeClass}">${badgeTexto}</span>
      </div>
      <div class="rep-footer">
        <div class="rep-data">Desde ${dataStr}</div>
        <div class="rep-acoes" onclick="event.stopPropagation()">
          <button class="btn btn-purple btn-sm" onclick="entrarDireto('${r.user_id}')">▶ Entrar</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

// =============================================
// MODAL REP
// =============================================
async function abrirRep(uid) {
  repAtual = todosReps.find(r => r.user_id === uid);
  if (!repAtual) return;

  document.getElementById('modal-rep-uid').value = uid;
  document.getElementById('modal-rep-titulo').textContent = repAtual.nome || 'Representante';
  mudarTabRep('info');

  // Preencher plano
  document.getElementById('plano-status').value = repAtual.plano_status || 'trial';
  document.getElementById('plano-vencimento').value = repAtual.vencimento || '';
  document.getElementById('plano-obs').value = repAtual.observacoes_admin || '';

  abrirModal('modal-rep');
}

function mudarTabRep(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('ativo'));
  document.getElementById('tab-' + tab)?.classList.add('ativo');

  document.getElementById('tab-content-info').style.display = tab === 'info' ? '' : 'none';
  document.getElementById('tab-content-pedidos').style.display = tab === 'pedidos' ? '' : 'none';
  document.getElementById('tab-content-plano').style.display = tab === 'plano' ? '' : 'none';

  if (tab === 'info') renderInfoRep();
  if (tab === 'pedidos') carregarPedidosRep();
}

function renderInfoRep() {
  const r = repAtual;
  if (!r) return;
  const badgeClass = { ativo: 'plan-ativo', trial: 'plan-trial', inadimplente: 'plan-inadimplente', cancelado: 'plan-cancelado' }[r.plano_status] || 'plan-trial';

  document.getElementById('rep-infos').innerHTML = `
    <div class="info-row"><span class="info-label">Nome</span><span class="info-valor">${escHtml(r.nome || '—')}</span></div>
    <div class="info-row"><span class="info-label">E-mail</span><span class="info-valor">${escHtml(r.email || '—')}</span></div>
    <div class="info-row"><span class="info-label">Telefone</span><span class="info-valor">${escHtml(r.telefone || '—')}</span></div>
    <div class="info-row"><span class="info-label">Plano</span><span class="plan-badge ${badgeClass}" style="font-size:12px">${r.plano_status || 'trial'}</span></div>
    <div class="info-row"><span class="info-label">Vencimento</span><span class="info-valor">${r.vencimento ? new Date(r.vencimento).toLocaleDateString('pt-BR') : '—'}</span></div>
    <div class="info-row"><span class="info-label">ID</span><span class="info-valor" style="font-size:11px;color:var(--gray-400)">${r.user_id}</span></div>
  `;
}

async function carregarPedidosRep() {
  const uid = document.getElementById('modal-rep-uid').value;
  const el = document.getElementById('rep-pedidos-lista');
  el.innerHTML = '<div style="text-align:center;padding:20px;color:var(--gray-400)">Carregando...</div>';

  try {
    const pedidos = await sbRpc('suporte_pedidos', { p_user_id: uid }) || [];

    if (pedidos.length === 0) {
      el.innerHTML = '<div class="vazio"><div class="vazio-icone">📋</div><div class="vazio-texto">Nenhum pedido</div></div>';
      return;
    }

    const recentes = pedidos.slice(0, 20);
    el.innerHTML = `<div style="font-size:13px;color:var(--gray-500);margin-bottom:12px">${pedidos.length} pedidos no total</div>` +
      recentes.map(p => {
        const dataStr = p.created_at ? new Date(p.created_at).toLocaleDateString('pt-BR') : '';
        return `<div class="mini-pedido">
          <div class="mini-pedido-header">
            <div class="mini-pedido-marca">${escHtml(p.marca || '')}</div>
            <div class="mini-pedido-valor">R$ ${(parseFloat(p.valor_total)||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}</div>
          </div>
          <div style="display:flex;justify-content:space-between">
            <div class="mini-pedido-cliente">${escHtml(p.cliente_nome || '')}</div>
            <div class="mini-pedido-data">${dataStr}</div>
          </div>
        </div>`;
      }).join('');
  } catch(e) {
    el.innerHTML = '<div style="color:var(--red);font-size:13px;padding:12px">Erro ao carregar pedidos.</div>';
    console.error(e);
  }
}

async function salvarPlano() {
  const uid = document.getElementById('modal-rep-uid').value;
  const status = document.getElementById('plano-status').value;
  const vencimento = document.getElementById('plano-vencimento').value;
  const obs = document.getElementById('plano-obs').value.trim();

  mostrarLoading('Salvando plano...');
  try {
    await sb('/rest/v1/rep_planos', {
      method: 'POST',
      body: JSON.stringify({ user_id: uid, status, vencimento: vencimento || null, observacoes_admin: obs }),
      headers: { 'Prefer': 'resolution=merge-duplicates,return=representation' }
    });

    // Atualizar local
    const idx = todosReps.findIndex(r => r.user_id === uid);
    if (idx >= 0) {
      todosReps[idx] = { ...todosReps[idx], plano_status: status, vencimento, observacoes_admin: obs };
      repAtual = todosReps[idx];
    }

    fecharModal('modal-rep');
    mostrarToast('Plano atualizado!');
    atualizarStats();
    filtrarReps();
  } catch(e) {
    document.getElementById('plano-erro').textContent = 'Erro ao salvar. Verifique se a tabela rep_planos existe.';
    console.error(e);
  } finally { esconderLoading(); }
}

function entrarComoRep() {
  const uid = document.getElementById('modal-rep-uid').value;
  fecharModal('modal-rep');
  entrarDireto(uid);
}

function entrarDireto(uid) {
  const url = `/?support_uid=${uid}`;
  window.open(url, '_blank');
}

// =============================================
// UTILITÁRIOS
// =============================================
function fmt(valor) {
  return 'R$ ' + (parseFloat(valor) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function mostrarToast(msg, duracao = 3000) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('visivel');
  setTimeout(() => el.classList.remove('visivel'), duracao);
}

function mostrarLoading(msg = 'Carregando...') {
  document.getElementById('loading-texto').textContent = msg;
  document.getElementById('loading').classList.add('visivel');
}

function esconderLoading() {
  document.getElementById('loading').classList.remove('visivel');
}

function abrirModal(id) {
  document.getElementById(id).classList.add('visivel');
  document.body.style.overflow = 'hidden';
}

function fecharModal(id) {
  document.getElementById(id).classList.remove('visivel');
  document.body.style.overflow = '';
}

document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) {
      overlay.classList.remove('visivel');
      document.body.style.overflow = '';
    }
  });
});

// =============================================
// INIT
// =============================================
async function init() {
  const sessaoStr = localStorage.getItem('repgo_admin_session');
  if (sessaoStr) {
    try {
      adminUser = JSON.parse(sessaoStr);
      const user = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${adminUser.access_token}` }
      }).then(r => r.json());
      if (user?.id) {
        await mostrarAdminApp();
        return;
      }
    } catch(e) { localStorage.removeItem('repgo_admin_session'); }
  }
  document.getElementById('tela-auth').style.display = '';
}

document.getElementById('adm-senha').addEventListener('keydown', e => {
  if (e.key === 'Enter') fazerLoginAdmin();
});

init();
</script>
